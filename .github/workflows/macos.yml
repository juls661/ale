name: macOS developer preview

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run macos:build
      - run: npx playwright install chromium webkit
      - run: npx playwright test --browser chromium --workers=2
        env:
          ALE_PRODUCTION: '1'
      - run: npx playwright test --browser webkit --workers=2
        env:
          ALE_PRODUCTION: '1'
      - name: Compile Xcode target without an Apple signing account
        run: xcodebuild -project macos/Ale.xcodeproj -scheme Ale -configuration Debug -destination 'platform=macOS' -derivedDataPath release/Xcode CODE_SIGNING_ALLOWED=NO build
      - name: Archive development app
        run: ditto -c -k --sequesterRsrc --keepParent release/Ale-mac-universal/Ale.app release/Ale-macos-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Ale-macos-developer-preview
          path: release/Ale-macos-preview.zip
          retention-days: 14
